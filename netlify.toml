# ============================================================================
# Frog Empire Foundation — Netlify configuration
# Performance (caching), security headers, and SEO-friendly behavior.
# ============================================================================

[build]
  publish = "."

# ---- Static assets ----
# styles.css and main.js keep FIXED filenames, so "immutable" was wrong: it told
# every browser to pin whatever copy it had for a year and never revalidate.
# Returning visitors kept old CSS against new HTML and saw an unstyled page.
# ETag revalidation instead: a 304 costs one tiny round trip and is always correct.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images also have fixed names, but they change rarely and are the heavy ones.
# An hour of freshness, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ---- HTML: always revalidate so content edits go live immediately ----
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Security + best-practice headers (applied site-wide) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-XSS-Protection = "1; mode=block"

# ---- Pretty URLs: let /about resolve to /about.html (no broken links;
#      existing .html links keep working too) ----
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/programs"
  to = "/programs.html"
  status = 200
[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200
[[redirects]]
  from = "/sponsor"
  to = "/sponsor.html"
  status = 200
[[redirects]]
  from = "/get-involved"
  to = "/get-involved.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/donate"
  to = "/sponsor.html#donate"
  status = 301
